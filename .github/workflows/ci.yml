name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Node.js 24.4.0 설치
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24.4.0"

      # 3. npm 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript 타입 검사 (선택 사항)
      - name: Type check
        run: npx tsc --noEmit

      # 5. ESLint (선택)
      - name: Lint check
        run: npm run lint

      # # 6. 테스트 실행 (Vitest 기준)
      # - name: Run tests
      #   run: npm run test -- --coverage

      # 7. Vite 빌드 실행
      - name: Build app
        run: npm run build
